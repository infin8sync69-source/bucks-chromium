# One stage of a Chromium build on a free GitHub machine (called by build-github.yml).
#
# A GitHub job may run for at most 6 hours, and a full Chromium build on 4 cores takes longer, so the
# build runs as a chain of stages. Stage 1 fetches Chromium and saves the source as an artifact. Every
# stage restores the source and the previous stage's build output, builds until shortly before the
# 6-hour limit, stops cleanly and saves the output for the next stage. The stage that finishes
# uploads the browser.
name: build stage
on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      previous:
        description: "number of the stage before this one (empty for stage 1)"
        type: string
        default: ""
      profile:
        type: string
        default: linux_ci
      src_run:
        description: "run id holding the src artifact (empty: this run)"
        type: string
        default: ""
      out_run:
        description: "run id holding the previous stage's output (empty: this run)"
        type: string
        default: ""
    outputs:
      done:
        description: "true when the build finished in this stage"
        value: ${{ jobs.stage.outputs.done }}

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    outputs:
      done: ${{ steps.build.outputs.done }}
    env:
      PROFILE: ${{ inputs.profile }}
      WORK: /mnt/bucks
    steps:
      - name: Note the start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          sudo mkdir -p "$WORK/archive" && sudo chown -R "$USER" "$WORK"
          df -h / /mnt

      - uses: actions/checkout@v4
        with:
          path: bucks-chromium
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/bucks-core"
          path: bucks-core
          ssh-key: "${{ secrets.BUCKS_CORE_DEPLOY_KEY }}"  # read-only deploy key of bucks-core

      - name: Move both repos to the large disk and install depot_tools
        run: |
          mv bucks-chromium bucks-core "$WORK/"
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WORK/depot_tools"
          echo "$WORK/depot_tools" >> "$GITHUB_PATH"
          # A fresh depot_tools must bootstrap its own Python and tools before gn or autoninja run.
          # Stage 1 gets this from `gclient sync`; later stages skip that, so do it explicitly.
          "$WORK/depot_tools/ensure_bootstrap"
          PATH="$WORK/depot_tools:$PATH" gclient --version

      # ---- stage 1: fetch Chromium and save the source -------------------------------------------
      - name: Fetch Chromium and apply Bucks patches
        if: inputs.stage == 1
        working-directory: /mnt/bucks/bucks-chromium
        run: |
          ./bucks init
          du -sh src
          df -h / /mnt
      - name: Pack the source
        if: inputs.stage == 1
        run: |
          tar -C "$WORK/bucks-chromium" -cf - src | zstd -T0 -3 | split -b 2G - "$WORK/archive/src.tar.zst."
          ls -lh "$WORK/archive"
      - name: Save the source for later stages
        if: inputs.stage == 1
        uses: actions/upload-artifact@v4
        with:
          name: src
          path: /mnt/bucks/archive/src.tar.zst.*
          compression-level: 0
          retention-days: 3
      - name: Remove the packed source
        if: inputs.stage == 1
        run: rm -f "$WORK"/archive/*

      # ---- later stages: restore source and previous output ----------------------------------------
      - name: Download the source
        if: inputs.stage > 1
        uses: actions/download-artifact@v4
        with:
          name: src
          path: /mnt/bucks/archive
          run-id: ${{ inputs.src_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download the previous stage's build output
        if: inputs.stage > 1
        uses: actions/download-artifact@v4
        with:
          name: out-${{ inputs.previous }}
          path: /mnt/bucks/archive
          run-id: ${{ inputs.out_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Unpack source and build output
        if: inputs.stage > 1
        run: |
          cat "$WORK"/archive/src.tar.zst.* | zstd -d | tar -x -C "$WORK/bucks-chromium"
          rm -f "$WORK"/archive/src.tar.zst.*
          cat "$WORK"/archive/out.tar.zst.* | zstd -d | tar -x -C "$WORK/bucks-chromium/src"
          rm -f "$WORK"/archive/*
          ln -sfn "$WORK/bucks-core" "$WORK/bucks-chromium/src/bucks"
          df -h / /mnt

      # ---- every stage: build until shortly before the time limit ----------------------------------
      - name: Install build dependencies
        run: sudo "$WORK/bucks-chromium/src/build/install-build-deps.sh" --no-prompt

      - name: Build
        id: build
        working-directory: /mnt/bucks/bucks-chromium
        run: |
          elapsed=$(( ($(date +%s) - JOB_START) / 60 ))
          limit=$(( 358 - 40 - elapsed ))   # keep 40 minutes to save the output
          echo "building for at most $limit minutes"
          set +e
          ./bucks build "$PROFILE" --time-limit "$limit"
          code=$?
          set -e
          df -h / /mnt
          if [ "$code" = 0 ]; then echo "done=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 3 ]; then echo "done=false" >> "$GITHUB_OUTPUT"
          else exit "$code"; fi

      # ---- not finished: save the output for the next stage ----------------------------------------
      - name: Pack the build output
        if: steps.build.outputs.done == 'false'
        run: |
          tar -C "$WORK/bucks-chromium/src" -cf - out | zstd -T0 -3 | split -b 2G - "$WORK/archive/out.tar.zst."
          ls -lh "$WORK/archive"
      - name: Save the build output for the next stage
        if: steps.build.outputs.done == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ inputs.stage }}
          path: /mnt/bucks/archive/out.tar.zst.*
          compression-level: 0
          retention-days: 3

      # ---- finished: package the browser -----------------------------------------------------------
      - name: Package the browser
        if: steps.build.outputs.done == 'true'
        working-directory: /mnt/bucks/bucks-chromium/src/out
        run: |
          cd "$PROFILE"
          files=$(ls -d chrome chrome_crashpad_handler chrome_sandbox *.pak *.bin *.dat *.so *.so.* \
            *.json locales resources MEIPreload 2>/dev/null || true)
          tar -cf - $files | zstd -T0 -19 > "$WORK/archive/bucks-$PROFILE.tar.zst"
          ls -lh "$WORK/archive"
      - name: Upload the browser
        if: steps.build.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bucks-${{ inputs.profile }}
          path: /mnt/bucks/archive/bucks-${{ inputs.profile }}.tar.zst
          compression-level: 0
          retention-days: 14
